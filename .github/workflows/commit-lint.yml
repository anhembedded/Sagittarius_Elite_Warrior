# EPIC-031A — every commit a pull request adds follows commit-rule.md §2.
# The check runs over the pull request's own commits only (base..head), so an
# old non-conforming commit on master-warrior never fails a new pull request.
name: commit-lint

on:
  pull_request:
    branches: [master-warrior]
    # `edited` re-runs the fix-body and design steps when the description changes.
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  commit-lint:
    name: commit-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the pull request's commit messages
        run: >-
          python3 scripts/check_commit_messages.py
          "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      # BOT-180 — a `fix:` pull request carries its root cause, corrective action
      # and before/after sequence (fix-bug-rule.md §6.1). Title and body travel
      # through the environment, never through the shell command line.
      - name: Check a fix pull request's description
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check_fix_pr_body.py
      # EPIC-041J — a pull request that changes `src/modules/<m>/` for a module
      # with a `Docs/MODULES/<m>/` folder changes that folder too, or says under
      # `## Design` why not (commit-rule.md §1, "Design in step").
      - name: Check a documented module's design is kept in step
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_design_in_step.py
