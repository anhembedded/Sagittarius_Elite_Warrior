# The alarm for the scheduled audits (EPIC-030L).
#
# ONBOARDING.md §13 says every scheduled audit run leaves a dated report under
# Tasks/reports/ and that silence is never success, but nothing noticed the
# silence: the 2026-10-04 audit found test_health quiet for 27 days and
# process_drift never run. This workflow runs scripts/check_audit_freshness.py
# daily and, when an audit is stale, comments on the open `audit-stale` issue
# or opens one. The issue is the alarm, so the run itself stays green after
# filing it; a red run means the check itself broke.
name: Audit freshness

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

defaults:
  run:
    shell: bash

jobs:
  freshness:
    name: check_audit_freshness.py
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check audit freshness
        id: check
        # Exit 1 is the script's "stale" answer; anything else non-zero means
        # the script broke, and fails the run.
        run: |
          set +e
          python3 scripts/check_audit_freshness.py > freshness.txt 2>&1
          status=$?
          cat freshness.txt
          if [ "$status" -eq 1 ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "stale=false" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: File or update the audit-stale issue
        if: steps.check.outputs.stale == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const label = 'audit-stale';
            const { owner, repo } = context.repo;
            const output = fs.readFileSync('freshness.txt', 'utf8').trim();
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              '```',
              output,
              '```',
              '',
              'Every scheduled audit run must leave a dated report under `Tasks/reports/` ' +
                '(`.claude/ONBOARDING.md` §13). Run the overdue audit: ' +
                '`.claude/skills/test-health/SKILL.md`, `.claude/skills/process-drift/SKILL.md`.',
              '',
              `Run: ${runUrl}`,
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label, per_page: 1,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: open[0].number, body,
              });
              core.info(`Commented on #${open[0].number}`);
              return;
            }
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: 'd93f0b',
                description: 'A scheduled audit has not reported recently',
              });
            }
            const { data: issue } = await github.rest.issues.create({
              owner, repo, title: 'Scheduled audits are stale', body, labels: [label],
            });
            core.info(`Opened #${issue.number}`);
