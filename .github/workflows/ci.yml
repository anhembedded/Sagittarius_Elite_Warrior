# Restored on master-warrior, where it had simply gone missing: the branch
# carried no .github/ at all, so no run had fired since 2026-08-10 and the
# repository looked green only because nothing was checking it.
#
# Three separate faults had to be cleared before a run could reach the tests:
#   1. the file's absence from this branch (above);
#   2. triggers on `[main, develop]`, neither of which exists any more;
#   3. the engine install — see the "Install Sagittarius Engine" step, which
#      is why every historical run died before Ruff and pytest never once
#      executed on CI.
name: Sagittarius Elite Warrior CI

on:
  push:
    branches: [master-warrior]
  pull_request:
    branches: [master-warrior]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    env:
      # Qt has no display on the runner. Every local gate exports the same
      # thing (scripts/ci-local.ps1), so this only brings CI level with it.
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Qt runtime libraries
        # PySide6 ships its own Qt binaries but still dlopen()s these from the
        # system; without them `import PySide6.QtWidgets` fails at collection
        # time, taking the whole suite with it. Never needed before because no
        # CI run ever got as far as importing Qt.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xfixes0 libxkbcommon0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Sagittarius Engine
        # Cloned without submodules, then installed from the local path.
        # `pip install git+...` cannot be used: pip always follows a git URL
        # with `git submodule update --init --recursive`, and the engine
        # carries a PRIVATE submodule (tools/Sagittarius_LogViewer) that an
        # unauthenticated runner cannot clone — "could not read Username for
        # 'https://github.com'". That single line is what failed every CI run
        # in this repository's history. LogViewer is a developer tool, not a
        # runtime dependency, so leaving it uncloned costs the tests nothing.
        run: |
          git clone --depth 1 https://github.com/anhembedded/Sagittarius-Engine.git "${{ runner.temp }}/engine"
          python -m pip install --upgrade pip
          pip install "${{ runner.temp }}/engine"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff — Lint
        # `tools` as well as `src`/`tests`: the widget-kit showcase lives
        # there, and a whole top-level directory outside the lint gate is
        # how the gate quietly stops covering the repo.
        run: ruff check src tests tools

      - name: Ruff — Format Check
        run: ruff format --check src tests tools

      - name: Mypy — Static Type Check
        # Left out when this workflow was restored (PR #114) because the gate
        # was red on a clean base with two errors in scripts/; PR #122 fixed
        # them, so it can be enforced now rather than traded for a gate that
        # is always red.
        #
        # Two details are load-bearing, both copied from scripts/ci-local.ps1:
        #   * run from the PARENT of the checkout and name the targets
        #     `Sagittarius_Elite_Warrior/{src,scripts}` — src and scripts must
        #     be in the SAME invocation or a Port that stops being fully
        #     implemented goes undetected (BUG-026);
        #   * PYTHONPATH must carry the checkout AND its parent. Without it
        #     mypy cannot resolve `Sagittarius_Elite_Warrior.src...` to the
        #     same module names the config excludes, so `presentation/` stops
        #     being excluded and the run reports 561 errors instead of 0.
        run: |
          cd ..
          PYTHONPATH="$GITHUB_WORKSPACE:$PWD" mypy \
            --config-file "$GITHUB_WORKSPACE/pyproject.toml" \
            --namespace-packages --explicit-package-bases \
            Sagittarius_Elite_Warrior/src Sagittarius_Elite_Warrior/scripts

      - name: Run Pytest with Coverage
        # Tests import `Sagittarius_Elite_Warrior.src...` — the checkout
        # directory itself as a package — so the PARENT of the checkout must be
        # on the path, not the checkout root. actions/checkout nests the repo as
        # <workspace>/<repo>, and the directory name already matches the package
        # name, so `..` is exactly right.
        run: |
          PYTHONPATH=.. pytest tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            -q
