name: Binance Bot CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        id: dependencies
        run: |
          python -m pip install --upgrade pip

          # Install Sagittarius Engine from GitHub
          pip install git+https://github.com/anhembedded/Sagittarius-Engine.git

          # Install Bot specific dependencies from requirements.txt
          pip install -r requirements.txt

          PYSIDE_VERSION=$(python -c 'import PySide6; print(PySide6.__version__)')
          echo "PYSIDE_VERSION=$PYSIDE_VERSION" >> "$GITHUB_ENV"
          echo "pyside-version=$PYSIDE_VERSION" >> "$GITHUB_OUTPUT"
          pip install aqtinstall

      - name: Cache matching Qt SDK
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-linux-gcc64-${{ steps.dependencies.outputs.pyside-version }}

      - name: Install matching Qt SDK
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: >-
          python -m aqt install-qt linux desktop "$PYSIDE_VERSION" linux_gcc_64
          --outputdir "$RUNNER_TEMP/Qt"

      - name: Build native chart QML plugin
        run: |
          cmake -S native/chart_renderer -B build/native-chart \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/Qt/$PYSIDE_VERSION/gcc_64"
          cmake --build build/native-chart --config Release --parallel

      - name: Chart migration benchmark contract
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ..
        run: |
          python -m Sagittarius_Elite_Warrior.scripts.benchmarking.chart_migration_benchmark \
            --backend both \
            --ci-contract \
            --report chart-migration-benchmark.json

      - name: Upload chart migration benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chart-migration-benchmark
          path: chart-migration-benchmark.json
          if-no-files-found: warn
          retention-days: 14

      - name: Ruff — Lint
        run: ruff check src tests

      - name: Ruff — Format Check
        run: ruff format --check src tests

      - name: Run Pytest with Coverage
        run: |
          # Tests import `Sagittarius_Elite_Warrior.src...` (the checkout dir as a package), so the
          # parent of the checkout — where actions/checkout nests it as <repo>/<repo> —
          # must be on the path, not the checkout root itself.
          PYTHONPATH=.. pytest tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            -v
