name: Binance Bot CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          # Install Sagittarius Engine from GitHub
          pip install git+https://github.com/anhembedded/Sagittarius-Engine.git

          # Install Bot specific dependencies from requirements.txt
          pip install -r requirements.txt

      - name: Ruff — Lint
        run: ruff check src tests

      - name: Ruff — Format Check
        run: ruff format --check src tests

      - name: Run Pytest with Coverage
        run: |
          # Tests import `Sagittarius_Elite_Warrior.src...` (the checkout dir as a package), so the
          # parent of the checkout — where actions/checkout nests it as <repo>/<repo> —
          # must be on the path, not the checkout root itself.
          PYTHONPATH=.. pytest tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            -v
