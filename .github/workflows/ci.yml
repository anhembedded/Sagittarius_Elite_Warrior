# One gate, two runners. This workflow prepares the environment and then runs
# scripts/ci-local.ps1 -Full — the same script every local handoff uses — so
# "green" has one definition (ci-rule.md §1). On GitHub it runs as two parts
# in parallel (`-Part Unit`, `-Part Rest`) and one job, still named
# `ci-local.ps1 -Full`, that requires both and enforces the combined coverage
# (BOT-160). Until 2026-09-17 it re-listed
# the script's steps by hand and drifted from them twice (the ruff targets,
# the testnet exclusion) with nothing to say so.
#
# History that still matters: this file was once missing from the branch
# entirely, and every early run died installing the engine, because
# `pip install git+URL` inits the engine's PRIVATE submodule
# (tools/Sagittarius_LogViewer) — hence the clone below (install-rule.md §1).
name: Sagittarius Elite Warrior CI

on:
  push:
    branches: [master-warrior]
  pull_request:
    branches: [master-warrior]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The gate only reads the repository and passes artifacts between its own
# jobs (which needs no token scope), so the token gets read access to the
# contents and nothing else (CodeQL `actions/missing-workflow-permissions`).
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  part:
    # The gate in two halves on two runners at once (BOT-160): the unit tier
    # took about three quarters of the single job's test time, so splitting it from the
    # static checks, integration and sanity cuts the wait to the longer half.
    # Nothing is dropped: the parts together run what -Full runs.
    name: gate (${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [Unit, Rest]

    steps:
      - name: Checkout Repository
        # actions/checkout nests the repo as <workspace>/Sagittarius_Elite_Warrior,
        # which is the package name the tests import — the script puts the
        # parent on PYTHONPATH exactly as it does locally.
        uses: actions/checkout@v4

      - name: Install Qt runtime libraries
        # PySide6 ships its own Qt but still dlopen()s these from the system;
        # without them `import PySide6.QtWidgets` fails at collection time.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xfixes0 libxkbcommon0 libfontconfig1

      - name: Set up Python 3.12
        # The floor, on purpose: a 3.13-only construct must fail here, not on
        # the next person who installs on 3.12 (install-rule.md §1b).
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.lock"

      - name: Install Sagittarius Engine
        # Pinned (EPIC-031B): `engine.ref` names the one engine commit this tree
        # is tested against, so two runs of one commit build the same thing.
        # Bumping the engine is a pull request that edits `engine.ref`. The same
        # installer every launcher uses (BUG-148), so the gate's Engine Pin step
        # finds the commit it recorded.
        run: |
          python -m pip install --upgrade pip
          python scripts/engine_pin.py install

      - name: Install dependencies
        # The lock (EPIC-031B), not the loose requirements: every transitive
        # version is the one the last green run used.
        run: pip install -r requirements.lock

      - name: Run the gate
        # No .venv on the runner, so the script uses the tools on PATH — the
        # ones pip just installed. Worker count derives from the runner's
        # cores. Output goes to a file and the verdict block is printed from
        # it, the way ci-rule.md §3 says to read a run. On a red run the log
        # file's failure lines are printed too: the job log is where a red run
        # is diagnosed (ci-rule.md §1), and the artifact sits on a host a
        # session reading the job log cannot always reach.
        env:
          # The booted workbench's pictures, one per mode and window size,
          # for the reviewer and the user to judge by eye (pr-review SKILL
          # §5.1, test_workbench_screenshots.py).
          SEW_UI_SCREENSHOTS: ${{ github.workspace }}/ui-screenshots
          # Each part keeps its own coverage data; the `gate` job below
          # combines both and enforces the 80% floor (BOT-160).
          COVERAGE_FILE: ${{ github.workspace }}/coverage/.coverage.${{ matrix.part }}
        run: |
          set +e
          mkdir -p coverage
          pwsh -NoProfile -File scripts/ci-local.ps1 -Full -Part ${{ matrix.part }} > gate-stdout.log 2>&1
          status=$?
          sed -n '/===CI_LOCAL_RESULT===/,/===END_CI_LOCAL_RESULT===/p' gate-stdout.log
          if [ "$status" -ne 0 ]; then
            log="$(grep -m1 '^LOG_FILE:' gate-stdout.log | sed 's/^LOG_FILE: *//')"
            grep -nE 'FAILED|ERROR|Traceback|ResourceWarning|Required test coverage' "${log:-gate-stdout.log}" | head -200
          fi
          exit $status

      - name: Keep the logs
        # The log file is the evidence (P4): on any outcome, attach the
        # script's transcript and stdout so a red run can be read, not guessed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-local-logs-${{ matrix.part }}
          path: |
            logs/
            gate-stdout.log
          if-no-files-found: warn

      - name: Keep the coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.part }}
          path: coverage/
          include-hidden-files: true
          if-no-files-found: error

      - name: Keep the UI pictures
        # The pictures come from the integration tier, which the Rest part runs.
        if: always() && matrix.part == 'Rest'
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ui-screenshots/
          if-no-files-found: warn

  gate:
    # Keeps the required check's name. It passes only when both parts passed
    # and their combined coverage holds the 80% floor; `if: always()` makes it
    # run (and fail) when a part fails, since a skipped required check would
    # read as passing.
    name: ci-local.ps1 -Full
    needs: part
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        # The coverage data names source files by the same absolute paths the
        # parts measured them at, so the report reads this checkout.
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage
        # The locked version, the one the parts wrote their data with.
        run: pip install "$(grep -E '^coverage==' requirements.lock)"

      - name: Collect the parts' coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true

      - name: Combine the parts
        run: |
          echo "Unit and Rest parts: ${{ needs.part.result }}"
          status=0
          if [ "${{ needs.part.result }}" != "success" ]; then
            echo "A part of the gate failed; read its job log (gate (Unit) / gate (Rest))."
            status=1
          fi
          export COVERAGE_FILE=coverage/.coverage
          if coverage combine --keep coverage/.coverage.Unit coverage/.coverage.Rest; then
            coverage report --fail-under=80 || status=1
          else
            echo "The parts' coverage data could not be combined."
            status=1
          fi
          echo "===CI_LOCAL_RESULT==="
          echo "RESULT: $([ "$status" -eq 0 ] && echo PASS || echo FAIL)"
          echo "PARTS: ${{ needs.part.result }}"
          echo "===END_CI_LOCAL_RESULT==="
          exit $status
