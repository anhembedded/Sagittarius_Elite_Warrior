    # errors in 11 files. Listed by file rather than as one directory
    # pattern: `symbol_options_coordinator.py`/`sync_progress_feed.py`/
    # `qml_property.py` (PR 4.4a) and the rest of this directory (`preview.py`
    # excepted, one line below) were already `mypy`-clean before this move,
