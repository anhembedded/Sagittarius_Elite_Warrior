    # path. The exit: ADR D21's rebuild of the chart's chrome, and a decision
    # about `pyqtgraph` stubs that belongs on `EPIC-002D`, not here.
    "^Sagittarius_Elite_Warrior[\\/]src[\\/]support[\\/]charting[\\/]",

    # `EPIC-025` PR 4.4b, fourth re-key on PR 0.4a's precedent: `screens/
