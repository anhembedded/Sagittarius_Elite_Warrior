[project]
# Declared floor, and it is enforced rather than merely stated:
# `tests/sanity/test_python_floor.py` reads this value and re-parses every
# first-party module at it, so code using newer syntax fails the tier even when
# the run happens on a newer interpreter.
#
# 3.12 is not a preference, it is the real minimum. `sagittarius_engine` uses
# PEP 695 generic syntax (`class Foo[T]:`) in three modules, which Python 3.11
# cannot parse at all. Verified 2026-08-25 on 3.12.3: 1,702 unit + 38
# integration + 16 sanity, all green. 3.13.12 is equally green; 3.14 is not
# usable yet — no stable CPython 3.14 was reachable, and on 3.14.0rc2 the
# pinned pydantic fails with `typing._eval_type() got an unexpected keyword
# argument 'prefer_fwd_module'`.
#
# This project is run from source, never installed as a distribution; there is
# deliberately no [build-system] table, so this block is metadata only.
name = "sagittarius-elite-warrior"
# First tracked version. `0.0.0` was the placeholder this project carried
# through 130 completed tasks; nothing in the code reads it, so it stated
# nothing. `0.1.x` rather than `1.0.0` on purpose: the roadmap still gates
# live trading (`Tasks/ROADMAP.md`), and a 1.0 would claim otherwise.
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
# ---------------------------------------------------------------------------
# Warning filters
#
# Format: "action:message:category:module:line"
#   ignore  → suppress entirely (third-party libs we can't fix)
#   error   → promote to test failure (our own code MUST NOT emit these)
#   default → show once (default behaviour)
# ---------------------------------------------------------------------------
filterwarnings = [
    # ── Third-party deprecations we cannot fix ────────────────────────────
    # python-binance uses the deprecated websockets.legacy API (websockets ≥ 14)
    "ignore:websockets.WebSocketClientProtocol is deprecated:DeprecationWarning",
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
    # PySide6 / Qt: QQmlPropertyMap constructor marked deprecated upstream
    "ignore:.*QQmlPropertyMap.*is marked as deprecated:DeprecationWarning",
    # pyqtgraph uses the old NumPy arr.shape setter (NumPy 2.5+ deprecation)
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:pyqtgraph",

    # ── Our code: promote to errors so they never silently regress ─────────
    # An AsyncMock coroutine that was created but never awaited is a test bug.
    # "error::RuntimeWarning:unittest.mock",

    # ResourceWarning for unclosed DB connections must be fixed at source —
    # do NOT suppress; keep them visible to track fixture cleanup progress.
]

asyncio_mode = "auto"

# ---------------------------------------------------------------------------
# Per-test timeout (`BUG-119`, 2026-09-14)
#
# A failing test is visible; a **hanging** test is not, and that asymmetry cost
# an afternoon. `execute_stream()` ends in `while True: time.sleep(1)` by design
# (a blocking foreground CLI). `EPIC-025` PR 0.4a-2 moved dispatch behind a port,
# the test's mock stopped intercepting the call the code makes, a permissive
# `Mock` passed the `success` guard, and one test entered that loop forever. Its
# xdist worker then never reported, the controller waited for it, and the gate
# stopped at 96% — three runs in a row, no test reported `FAILED`, no traceback,
# no exit code. It took `py-spy` on the live processes and a comparison of log
# byte counts to find a 15-line mistake.
#
# With this, the same hang is an ordinary failure naming the test.
#
# 60s is chosen against measurement, not taste. The slowest legitimate test in
# the suite is 22.93s (`test_a_task_outliving_shutdown_is_named_rather_than_
# hanging_silently`, which deliberately waits on a lingering thread); the next
# slowest is 5.18s. 60s is ~2.6x the outlier, so it has real headroom on a loaded
# machine, while still turning a hang into a failure within a minute instead of
# never. Raise it only with a fresh `--durations` measurement pasted into the
# commit; a test that legitimately needs longer should carry its own
# `@pytest.mark.timeout(...)` rather than push this global up for everyone.
#
# `method` is left at pytest-timeout's platform default (`signal` on Unix), which
# interrupts only the offending test and gives a traceback at the line that hung
# — verified against this exact hang, not assumed. Its known limit is code that
# blocks without releasing the GIL, where `thread` would be needed; that trade
# (killing the whole run) is not worth making until such a hang actually appears.
timeout = 60

[tool.ruff.lint]
# EPIC-004 — security and maintainability rules enabled incrementally from
# the baseline audit (Tasks/reports/EPIC-004A_ruff_security_quality_baseline_audit.md).
extend-select = ["S", "PLR2004", "B", "SIM", "ERA", "N"]

[tool.ruff.lint.per-file-ignores]
# These patterns are intentional in tests and Qt override methods respectively.
"tests/**" = ["S101", "S603", "S106", "S108", "PLR2004"]
"src/presentation/ui/**" = ["N802", "N803", "N815"]
# The repository/package name is intentionally PascalCase; Ruff otherwise
# derives it as the parent module name for these package markers.
"scripts/__init__.py" = ["N999"]
"scripts/benchmarking/__init__.py" = ["N999"]
# This standalone chart demo generates visual noise, never security tokens.
"src/presentation/ui/components/chart_card/__main__.py" = ["S311"]

[tool.mypy]
# EPIC-002 — gate opened at the exact baseline measured by EPIC-002A
# (Tasks/reports/EPIC-002A_mypy_baseline_audit.md), not at zero. Anything
# excluded here is PRE-EXISTING debt frozen at 2026-08-21, not permanently
# exempt — EPIC-002D's job is to shrink this list over time, never to grow
# it silently. A NEW file (or a file not in this list) that fails must be
# fixed, not added here.
namespace_packages = true
explicit_package_bases = true
exclude = [
    # `presentation/` excluded WHOLESALE (24 files / 133 errors) — 52% of
    # ALL src/ baseline errors are one systemic false-positive class: mypy
    # reads PySide6's `@Property` descriptor as its own `Property` type
    # instead of the runtime value type it actually returns. Not a real
    # bug category; needs a stub/plugin decision before this layer can be
    # checked meaningfully. See EPIC-002A report §2, §6.
    "^Sagittarius_Elite_Warrior[\\/]src[\\/]presentation[\\/]",

    # Everything below: real per-file baseline debt (not Property noise),
    # frozen at EPIC-002A's measurement.
    # `scripts/backtest_timeframe_toolbar_e2e.py` was here too — the LIVE
    # bug EPIC-002A found (same class as BUG-026) — fixed immediately after
    # this gate landed, so it's already off this list.
    "^Sagittarius_Elite_Warrior[\\/]scripts[\\/]benchmarking[\\/]backtest_cached_interaction_hybrid_probe\\.py$",
    "^Sagittarius_Elite_Warrior[\\/]scripts[\\/]benchmarking[\\/]backtest_chart_interaction\\.py$",
    "^Sagittarius_Elite_Warrior[\\/]scripts[\\/]benchmarking[\\/]backtest_hybrid_opengl_probe\\.py$",
    # `EPIC-025` PR 0.4a re-keyed five entries in this block to the paths the
    # files now live at. `market_data` became a module, so
    # `application/use_cases/queries/get_historical_klines/`,
    # `infrastructure/binance/client.py` and the three `infrastructure/
    # persistence/` files moved under `src/modules/market_data/`. Re-keying was
    # not optional and dropping them was not an option either: the entries are
    # frozen 2026-08-21 debt (SQLAlchemy `Column[T]`-vs-`T` typing, 21 errors),
    # and a path-only move neither fixes that debt nor creates it. Deleting the
    # lines would have hidden it; fixing 21 ORM typing errors inside a pure
    # move would have made the move unreviewable. This is the same trap the
    # `kline_row_mapper.py` note below records — a split that silently drops a
    # file out of gate coverage — caught this time by the gate itself.
    "^Sagittarius_Elite_Warrior[\\/]src[\\/]modules[\\/]market_data[\\/]application[\\/]queries[\\/]get_historical_klines[\\/]handler\\.py$",
    "^Sagittarius_Elite_Warrior[\\/]src[\\/]domain[\\/]strategies[\\/]ema_crossover_strategy\\.py$",
    "^Sagittarius_Elite_Warrior[\\/]src[\\/]domain[\\/]strategies[\\/]ema_trend_pullback_strategy\\.py$",
    "^Sagittarius_Elite_Warrior[\\/]src[\\/]domain[\\/]strategies[\\/]long_term_trend_zone_strategy\\.py$",
    "^Sagittarius_Elite_Warrior[\\/]src[\\/]domain[\\/]strategies[\\/]multi_ema_trend_follower_strategy\\.py$",
    "^Sagittarius_Elite_Warrior[\\/]src[\\/]modules[\\/]market_data[\\/]adapters[\\/]binance[\\/]client\\.py$",
    "^Sagittarius_Elite_Warrior[\\/]src[\\/]modules[\\/]market_data[\\/]adapters[\\/]persistence[\\/]models\\.py$",
    "^Sagittarius_Elite_Warrior[\\/]src[\\/]modules[\\/]market_data[\\/]adapters[\\/]persistence[\\/]sqlalchemy_repository\\.py$",
    # `kline_row_mapper.py` (`EPIC-018B`) inherited this same `Column[T]`-vs-`T`
    # debt verbatim when `to_market_data_entity()` was split out of
    # `sqlalchemy_repository.py` above — same root cause (SQLAlchemy ORM
    # attribute typing), just relocated. Merge-time discovery (`master-warrior`
    # merge, 2026-08-31): the split had silently dropped this file out of gate
    # coverage since nothing re-added it here.
    "^Sagittarius_Elite_Warrior[\\/]src[\\/]modules[\\/]market_data[\\/]adapters[\\/]persistence[\\/]kline_row_mapper\\.py$",

    # Surfaced only AFTER the exclusions above were applied — not part of the
    # original 45-file/251-error combined baseline scan (EPIC-002A), but
    # genuinely pre-existing: excluding the noisier files above changed how
    # mypy resolves a few of their dependents, revealing errors that were
    # always there but previously masked. Small, independent issues (Qt
    # attribute typos in probe scripts; one dispatch() type mismatch) —
    # frozen as debt the same way, not evidence of a config bug.
    "^Sagittarius_Elite_Warrior[\\/]scripts[\\/]benchmarking[\\/]backtest_cached_frame_probe\\.py$",
    "^Sagittarius_Elite_Warrior[\\/]scripts[\\/]shutdown_sync_probe\\.py$",

    # Same "surfaced only after exclusion" effect as above, found while
    # fixing `backtest_timeframe_toolbar_e2e.py`'s real BUG-026-class defect
    # (EPIC-002A §5): once that file's `[abstract]` error was fixed and it
    # came off this list, mypy could see one more, unrelated, pre-existing
    # error in it (`QApplication.instance()` typed as the more general
    # `QCoreApplication`, missing `setQuitOnLastWindowClosed`) — same class
    # already excluded for `shutdown_sync_probe.py` above.
    "^Sagittarius_Elite_Warrior[\\/]scripts[\\/]backtest_timeframe_toolbar_e2e\\.py$",

    # Retired 2026-08-26 (EPIC-002D): nine entries removed because they had
    # stopped excluding anything. Five named probe scripts deleted with the
    # native chart (36f3a9f), so the pattern matched no file at all; four
    # more -- repair_data_gap/handler.py, paper_exchange.py, indicators/rsi.py
    # and bulk_sync_market_data/handler.py -- had become type-clean without
    # anyone striking them off, which is the failure this list is most prone
    # to: an exclusion nobody re-measures reads as debt forever and quietly
    # keeps four real files outside the gate. Measured by stripping every
    # per-file entry and re-running the gate's own invocation: 16 of the 25
    # still had errors, these 9 did not.
]

[[tool.mypy.overrides]]
# python-binance ships no type stubs / py.typed marker — a third-party gap,
# not our code's debt. Without this, mypy's "Skipping analyzing"
# resolution failure cascades into dependents in a way that silently shrinks how many files get fully checked.
#
# `sagittarius_engine` was in this list too until 2026-08-23. It no longer
# belongs here: the engine ships a py.typed marker from 2.2.0 onward (engine
# TASK-027) and the installed version is 2.3.0, so mypy now reads its real
# annotations. Keeping the override would have silently degraded every engine
# symbol to `Any` — the opposite of what this gate exists for.
module = ["binance", "binance.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# EPIC-002D — first module piloted on `--strict`, per that task's own §2:
# Domain was the natural first candidate ("Strong Typing & Immutability"
# already followed everywhere — frozen dataclasses, full annotations, no
# bare `Any`), confirmed by measurement: only 15 errors across 3 files
# out of 83 source files, all real (Any leaking through a deliberately
# dynamic `input_*()` boundary, one missing generic type argument, one
# untyped-comparison-helper family) — fixed for real, not suppressed, in
# the same change that added this override.
#
# Spelled out as the individual flags `--strict` expands to (measured via
# `mypy.main.define_options()` on the pinned 1.19.1), NOT the `strict =
# true` shorthand: that shorthand does not scope reliably to the matched
# module in per-module override sections — verified the hard way, it
# leaked `disallow_untyped_calls`/`no-untyped-def` errors into unrelated
# `infrastructure/`/`application/`/`scripts/` files on the very first
# real-gate run after adding it.
#
# Widen this list as later modules earn it (§2.4 of that task); do not add
# a module here that has not actually been measured clean.
module = ["Sagittarius_Elite_Warrior.src.domain.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
# The 4 strategy files above are still `--strict`-dirty for a real,
# non-trivial reason (their shared indicator-handle dict collapses to
# `float | MACDValue | SupportResistanceValue`, so every per-strategy read
# needs a narrowing decision, not a one-line annotation) — already carried
# as pre-existing debt in the main `exclude` list above. Re-excluded from
# the blanket Domain strictness immediately above (each flag reset to its
# global, non-strict default) so this module pattern matching them too does
# not newly force them into the gate via being imported by another
# strict-checked Domain module; fixing them for real is follow-up work for
# a later `EPIC-002D` increment, not part of this one.
module = [
    "Sagittarius_Elite_Warrior.src.domain.strategies.ema_crossover_strategy",
    "Sagittarius_Elite_Warrior.src.domain.strategies.ema_trend_pullback_strategy",
    "Sagittarius_Elite_Warrior.src.domain.strategies.long_term_trend_zone_strategy",
    "Sagittarius_Elite_Warrior.src.domain.strategies.multi_ema_trend_follower_strategy",
]
disallow_any_generics = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
warn_unused_ignores = false
warn_return_any = false
implicit_reexport = true
strict_equality = false
extra_checks = false

[[tool.mypy.overrides]]
# EPIC-002D — second module: Application, per that task's own §2.3 ("mở
