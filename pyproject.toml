[project]
# Declared floor, and it is enforced rather than merely stated:
# `tests/sanity/test_python_floor.py` reads this value and re-parses every
# first-party module at it, so code using newer syntax fails the tier even when
# the run happens on a newer interpreter.
#
# 3.12 is not a preference, it is the real minimum. `sagittarius_engine` uses
# PEP 695 generic syntax (`class Foo[T]:`) in three modules, which Python 3.11
# cannot parse at all. Verified 2026-08-25 on 3.12.3: 1,702 unit + 38
# integration + 16 sanity, all green. 3.13.12 is equally green; 3.14 is not
# usable yet — no stable CPython 3.14 was reachable, and on 3.14.0rc2 the
# pinned pydantic fails with `typing._eval_type() got an unexpected keyword
# argument 'prefer_fwd_module'`.
#
# This project is run from source, never installed as a distribution; there is
# deliberately no [build-system] table, so this block is metadata only.
name = "sagittarius-elite-warrior"
# First tracked version. `0.0.0` was the placeholder this project carried
# through 130 completed tasks; nothing in the code reads it, so it stated
# nothing. `0.1.x` rather than `1.0.0` on purpose: the roadmap still gates
# live trading (`Tasks/ROADMAP.md`), and a 1.0 would claim otherwise.
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
# ---------------------------------------------------------------------------
# Warning filters
#
# Format: "action:message:category:module:line"
#   ignore  → suppress entirely (third-party libs we can't fix)
#   error   → promote to test failure (our own code MUST NOT emit these)
#   default → show once (default behaviour)
# ---------------------------------------------------------------------------
filterwarnings = [
    # ── Third-party deprecations we cannot fix ────────────────────────────
    # python-binance uses the deprecated websockets.legacy API (websockets ≥ 14)
    "ignore:websockets.WebSocketClientProtocol is deprecated:DeprecationWarning",
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
    # PySide6 / Qt: QQmlPropertyMap constructor marked deprecated upstream
    "ignore:.*QQmlPropertyMap.*is marked as deprecated:DeprecationWarning",
    # pyqtgraph uses the old NumPy arr.shape setter (NumPy 2.5+ deprecation)
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:pyqtgraph",

    # ── Our code: promote to errors so they never silently regress ─────────
    # An AsyncMock coroutine that was created but never awaited is a test bug.
    # "error::RuntimeWarning:unittest.mock",

    # ResourceWarning for unclosed DB connections must be fixed at source —
    # do NOT suppress; keep them visible to track fixture cleanup progress.
]

asyncio_mode = "auto"

# ---------------------------------------------------------------------------
# Per-test timeout (`BUG-119`, 2026-09-14)
#
# A failing test is visible; a **hanging** test is not, and that asymmetry cost
# an afternoon. `execute_stream()` ends in `while True: time.sleep(1)` by design
# (a blocking foreground CLI). `EPIC-025` PR 0.4a-2 moved dispatch behind a port,
# the test's mock stopped intercepting the call the code makes, a permissive
# `Mock` passed the `success` guard, and one test entered that loop forever. Its
# xdist worker then never reported, the controller waited for it, and the gate
# stopped at 96% — three runs in a row, no test reported `FAILED`, no traceback,
# no exit code. It took `py-spy` on the live processes and a comparison of log
# byte counts to find a 15-line mistake.
#
# With this, the same hang is an ordinary failure naming the test.
#
# 60s is chosen against measurement, not taste. The slowest legitimate test in
# the suite is 22.93s (`test_a_task_outliving_shutdown_is_named_rather_than_
# hanging_silently`, which deliberately waits on a lingering thread); the next
# slowest is 5.18s. 60s is ~2.6x the outlier, so it has real headroom on a loaded
# machine, while still turning a hang into a failure within a minute instead of
# never. Raise it only with a fresh `--durations` measurement pasted into the
# commit; a test that legitimately needs longer should carry its own
# `@pytest.mark.timeout(...)` rather than push this global up for everyone.
#
# `method` is left at pytest-timeout's platform default (`signal` on Unix), which
# interrupts only the offending test and gives a traceback at the line that hung
# — verified against this exact hang, not assumed. Its known limit is code that
# blocks without releasing the GIL, where `thread` would be needed; that trade
# (killing the whole run) is not worth making until such a hang actually appears.
timeout = 60

[tool.ruff]
# Pinned with requirements.txt (user decision 2026-09-17). Without a pin the gate's
# answer depended on the install date: on one tree, ruff 0.15.8 reported 92 E402
# errors that 0.16.7 does not. `required-version` makes a mismatched local ruff
# refuse to run instead of quietly reporting a different answer.
required-version = "==0.16.7"

[tool.ruff.lint]
# EPIC-004 — security and maintainability rules enabled incrementally from
# the baseline audit (Tasks/reports/EPIC-004A_ruff_security_quality_baseline_audit.md).
extend-select = ["S", "PLR2004", "B", "SIM", "ERA", "N"]

[tool.ruff.lint.per-file-ignores]
# These patterns are intentional in tests and Qt override methods respectively.
"tests/**" = ["S101", "S603", "S106", "S108", "PLR2004"]
# A contract suite is test code that ships in `src/` on purpose (HLD §10.3): the
# suite and the verified fake are the provider module's **public API**, imported
# by consumers in other modules, and `tests/` is not importable API. So `assert`
# — which is what a contract suite is made of — is correct here for the same
# reason it is correct under `tests/`, and `PLR2004` likewise: a literal
# expectation is the assertion, not a magic number.
#
# Deliberately narrow: only `contracts/testing/`. The rest of `src/` keeps S101,
# because an `assert` in production code is a check that vanishes under `-O`.
"src/modules/*/contracts/testing/**" = ["S101", "PLR2004"]
"src/presentation/ui/**" = ["N802", "N803", "N815"]
# Same three, same reason, second tree: `EPIC-025` PR 1.6a/1.6b moved the icon
# loader and then the whole widget kit into `support/ui_kit`, and a Qt override
# is still `mousePressEvent`, not `mouse_press_event`, wherever the widget
# lives. The ignore follows the widgets rather than the directory they used to
# sit in — without it the move would have had to rename 14 Qt overrides, which
# is a behaviour change dressed as a move (ADR D12).
"src/support/ui_kit/**" = ["N802", "N803", "N815"]
# And a third tree, for the same reason: `EPIC-025` PR 1.6f moved `chart_card`,
# `timeframe_picker` and the QML timeframe picker into `support/charting`.
# pyqtgraph and Qt both hand this package camelCase overrides to implement
# (`eventFilter`, `viewRangeChanged`, `orthoRange`), and a `Signal` named
# `stateChanged` is Qt's own spelling of that concept.
"src/support/charting/**" = ["N802", "N803", "N815"]
# Fourth tree, same reason: PR 1.6g moved the indicator-script UI into
# `support/indicators/ui`, and `list_model.py` implements
# `QAbstractListModel` — `rowCount`, `roleNames`, `setEnabled` and a
# `enabledKeysChanged` signal are Qt's spellings, not choices.
"src/support/indicators/**" = ["N802", "N803", "N815"]
# Fifth tree, same reason, and this one is a re-key rather than a new
# exemption: `EPIC-025` PR 2.1e-1 moved strategy's own UI out of
# `presentation/ui/` (line 103's pattern) into `modules/strategy/ui/`, so the
# same 11 files need the same three codes at their new path. `signal_feed.py`
# declares a `signalGenerated` Signal, `param_field.py` overrides
# `keyPressEvent`/`wheelEvent`, and `strategy_arming_coordinator.py`'s view
# Protocol mirrors a Qt view model's camelCase properties -- renaming any of
# them would be a behaviour change dressed as a move (ADR D12).
"src/modules/strategy/ui/**" = ["N802", "N803", "N815"]

# `EPIC-025` PR 4.1a: `trading`'s six feeds left `presentation/ui/common/` (line
# 103's pattern) for `modules/trading/ui/`, and every one of them declares Qt
# `Signal` attributes in camelCase — `orderFilled`, `positionChanged`,
# `equitySampled`, `marketTick`. Same reason as `modules/strategy/ui` above: the
# names are PySide6's convention, not this repository's, and a `Signal` renamed
# to snake_case stops matching the QML and the `connect()` sites.
"src/modules/trading/ui/**" = ["N802", "N803", "N815"]
# Sixth tree, same reason: `EPIC-025E` PR 4.4a moved `sync_progress_feed.py`
# and `symbol_options_coordinator.py` out of `presentation/ui/common/` (line
# 110's pattern) into `modules/market_data/ui/`. `sync_progress_feed.py`
# declares `progressUpdated = Signal(object)` — PySide6's convention, not a
# choice this repository made, and renaming it would be a behaviour change
# dressed as a move (ADR D12), the same reason line 137 and line 145 exist.
"src/modules/market_data/ui/**" = ["N802", "N803", "N815"]
# Seventh tree, same reason: `EPIC-025E` PR 4.4d moved `screens/backtest` out
# of `presentation/ui/screens/` (line 110's pattern) into
# `modules/backtesting/ui/`. Its Presenter/View/view-models declare PySide6
# `Signal`/`Property` members in that library's own camelCase convention
# (`currentPage`, `searchText`, …), the same reason lines 137/145/152 exist.
"src/modules/backtesting/ui/**" = ["N802", "N803", "N815"]
# `TimeframePicker/` is a **QML module directory**, and QML requires its module
# names to be PascalCase — the `.qml` files inside are addressed by that name.
# It was invisible before 1.6f only by accident: under
# `presentation/ui/qml/` it was a *sub*package of a package with an
# `__init__.py`, and Ruff validates the package root's name, while `support/` is
# a namespace package throughout, which makes this directory a root. Renaming it
# would break the QML imports; the alternative to this line is renaming a Qt
# convention to satisfy a Python one.
"src/support/charting/TimeframePicker/**" = ["N999"]
# The repository/package name is intentionally PascalCase; Ruff otherwise
# derives it as the parent module name for these package markers.
"scripts/__init__.py" = ["N999"]
"scripts/benchmarking/__init__.py" = ["N999"]
# This standalone chart demo generates visual noise, never security tokens.
"src/support/charting/chart_card/__main__.py" = ["S311"]

[tool.mypy]
# EPIC-002 — gate opened at the exact baseline measured by EPIC-002A
# (Tasks/reports/EPIC-002A_mypy_baseline_audit.md), not at zero. Anything
# excluded here is PRE-EXISTING debt frozen at 2026-08-21, not permanently
# exempt — EPIC-002D's job is to shrink this list over time, never to grow
# it silently. A NEW file (or a file not in this list) that fails must be
# fixed, not added here.
namespace_packages = true
explicit_package_bases = true
exclude = [
    # `presentation/` excluded WHOLESALE (24 files / 133 errors) — 52% of
    # ALL src/ baseline errors are one systemic false-positive class: mypy
    # reads PySide6's `@Property` descriptor as its own `Property` type
    # instead of the runtime value type it actually returns. Not a real
    # bug category; needs a stub/plugin decision before this layer can be
    # checked meaningfully. See EPIC-002A report §2, §6.
    "^Sagittarius_Elite_Warrior[\\/]src[\\/]presentation[\\/]",

    # `EPIC-025` PR 1.6d re-keyed two entries out of the block above, the same
    # way PR 0.4a re-keyed five: a path-only move neither fixes frozen debt nor
    # creates it, and fixing it inside a move would make the move unreviewable.
    # `sidebar/` carries 5 errors, every one the PySide6 `@Property`
    # false-positive class the wholesale `presentation/` exclusion exists for
    # (EPIC-002A §2): `Property("QVariant", ...)` takes a type name as a string
    # at runtime while the stub says `type`, and mypy reads the descriptor as
    # its own `Property` type instead of the value type it returns.
    # `registry/screen_registry.py` carries 1, and it is not that class: the
    # engine declares `PresenterManager.register(name, presenter_class: type,
    # view_factory)` while its body only stores the argument in a dict and
    # calls it later, so a factory callable is accepted at runtime and the
    # annotation is simply narrower than the contract. Verified by reading that
    # method — it performs no `issubclass` check. The exit for both is the same:
    # `EPIC-025` Phase 4 rebuilds the sidebar as QtWidgets (ADR D20-D22), which
    # removes the `@Property` bindings, and the engine's annotation belongs on
    # the Engine board, not in this application's exclude list.
    "^Sagittarius_Elite_Warrior[\\/]src[\\/]support[\\/]ui_kit[\\/]sidebar[\\/]",
    "^Sagittarius_Elite_Warrior[\\/]src[\\/]support[\\/]ui_kit[\\/]registry[\\/]",

    # `EPIC-025` PR 1.6f, third re-key on PR 0.4a's precedent and the largest:
    # `chart_card` (27 files) + the QML timeframe picker left `presentation/`
    # and arrived with **43** pre-existing errors in 20 files. Measured by
    # code before deciding, because "43 errors, excluded" is not a record:
    #
    #   13  import-untyped   `pyqtgraph` ships no `py.typed`. Not fixable in
    #                        this repository at all — it needs a stub package
    #                        or an `ignore_missing_imports` override, and both
    #                        are decisions about a dependency, not about this
    #                        move.
    #   16  attr-defined     PySide6 stub gaps of the same family as
    #                        `QCoreApplication.platformName` — `Qt`
    #                        enumerations and `pyqtgraph` attributes the stubs
    #                        do not carry.
    #    8  annotation-unchecked  bodies mypy declines to check because they
    #                        are inside an unannotated function.
    #    6  arg-type/return-value  real typing debt in the chart's geometry
    #                        batching, frozen 2026-08-21 with the rest.
    #
    # Fixing 43 typing errors inside a 37-file move makes the move
    # unreviewable, which is the reason PR 0.4a's comment above gives for
    # re-keying rather than either fixing or dropping. Two were **not**
    # re-keyed because they were this pull request's own doing and are fixed
